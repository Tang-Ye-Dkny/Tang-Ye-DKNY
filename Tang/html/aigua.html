<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>爱瓜TV WebHome</title>
<style>
  :root{--panel-rgb:42,50,58;--panel:rgba(var(--panel-rgb),0.62);--panel-soft:rgba(var(--panel-rgb),0.44);--panel-strong:rgba(var(--panel-rgb),0.86);--line:rgba(255,255,255,0.16);--text:#f7fbff;--muted:rgba(247,251,255,0.68);--accent:#ff6b35;--accent2:#ffb86b;--radius:16px;--shadow:0 12px 40px rgba(0,0,0,0.3)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  html:not(.fm-native) body{background:#1e242a}
  .app{min-height:100vh;background:transparent;padding:8px 10px 30px}
  .top{position:relative;z-index:1;padding:6px 0 8px;border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:6px}
  .brand{flex:0 0 auto;font-size:20px;font-weight:900}.brand b{color:var(--accent2)}
  .search{flex:1;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:4px 5px 4px 12px}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:15px}
  .search input::placeholder{color:var(--muted)}
  .btn{background:var(--panel-soft);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,rgba(255,107,53,0.85),rgba(255,184,107,0.7));border-color:rgba(255,184,107,0.6);color:#17110d;font-weight:700}
  .tabs{display:flex;gap:6px;overflow:auto;padding:8px 2px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--muted);cursor:pointer}
  .tab.active{background:linear-gradient(135deg,rgba(255,107,53,0.45),rgba(255,184,107,0.25));color:var(--text);border-color:rgba(255,184,107,0.6);font-weight:700}
  .status{margin:8px 2px 6px;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .card{position:relative;min-width:0;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.04));border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
  .card:focus,.card:hover{transform:translateY(-2px);outline:2px solid var(--accent2);outline-offset:2px}
  .poster{aspect-ratio:3/4;background:rgba(255,255,255,0.06);overflow:hidden;position:relative}
  .poster img{width:100%;height:100%;object-fit:cover;display:block}
  .poster .noimg{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
  .meta{padding:6px 8px 8px}
  .name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .remark{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .section{margin:14px 0}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
  .section-title h2{margin:0;font-size:16px}
  .empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--panel-soft);border:1px dashed var(--line);border-radius:var(--radius)}
  .loading{opacity:.7}

  .sheet{position:fixed;inset:0;z-index:40;display:none;background:transparent;overflow:hidden}
  .sheet.active{display:block}
  .sheet-inner{height:100vh;padding:12px;background:transparent;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .detail-panel{background:linear-gradient(135deg,rgba(40,30,64,0.7),rgba(24,20,42,0.6));border:1px solid rgba(255,255,255,0.10);border-radius:22px;box-shadow:var(--shadow);padding:16px 14px 22px;margin-bottom:30px}
  .detail-head{display:grid;grid-template-columns:38% 1fr;gap:14px;align-items:start}
  .detail-pic{width:100%;aspect-ratio:3/4;border-radius:14px;object-fit:cover;background:rgba(255,255,255,0.08);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
  .detail-title{font-size:22px;font-weight:600;margin:0 0 6px;line-height:1.2}
  .detail-info{font-size:14px;line-height:1.6;color:var(--muted)}
  .detail-info b{color:rgba(255,255,255,0.8);margin-right:4px}
  .intro-pill{display:inline-block;margin:18px 0 12px;padding:8px 22px;border-radius:999px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,184,107,0.5);color:rgba(255,255,255,0.9);font-size:16px;font-weight:600}
  .desc{color:rgba(255,255,255,0.7);font-size:16px;line-height:1.7;margin:0 2px 14px}
  .play-title{margin:12px 2px 6px;font-size:16px;font-weight:700}
  .line-tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 8px;padding-bottom:2px}
  .line-tab{border-radius:999px;padding:6px 12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);white-space:nowrap;color:rgba(255,255,255,0.8);cursor:pointer}
  .line-tab.active{background:rgba(255,107,53,0.35);border-color:rgba(255,184,107,0.6);font-weight:700}
  .episodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .ep{border-radius:12px;padding:8px 4px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);cursor:pointer;text-align:center;font-size:14px}
  .ep:focus,.ep:hover{background:rgba(255,107,53,0.25);outline:2px solid var(--accent2)}
  #closeDetail{margin:0 0 12px;padding:8px 20px;border-radius:999px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,184,107,0.5);cursor:pointer}
  body.detail-active .app{visibility:hidden;pointer-events:none}

  @media(min-width:720px){.grid{grid-template-columns:repeat(5,1fr)}.app{padding:16px 30px 40px}.detail-head{grid-template-columns:160px 1fr}.detail-pic{width:160px}.episodes{grid-template-columns:repeat(6,1fr)}}
  @media(min-width:1100px){.grid{grid-template-columns:repeat(7,1fr)}.app{max-width:1380px;margin:0 auto}.sheet-inner{max-width:1180px;margin:0 auto}}
  @media(max-width:480px){.app{padding:6px 6px 20px}.grid{grid-template-columns:repeat(3,1fr);gap:6px}.meta{padding:5px 6px 6px}.name{font-size:12px}.remark{font-size:10px}.detail-head{grid-template-columns:38% 1fr}.detail-title{font-size:20px}.episodes{grid-template-columns:repeat(4,1fr)}.ep{font-size:13px;padding:7px 2px}}
  html.no-layout-gap .grid{gap:6px} html.no-layout-gap .episodes{gap:6px}
  html.no-aspect-ratio .poster{height:0;padding-bottom:133.33%;position:relative}
  html.no-aspect-ratio .poster img{position:absolute;top:0;left:0;width:100%;height:100%}
  html.no-css-functions .detail-panel{border-radius:14px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="bar">
      <div class="brand">爱瓜<b>TV</b></div>
      <form class="search" id="searchForm">
        <input id="kw" type="text" placeholder="搜索影片…" autocomplete="off" />
        <button class="btn primary" type="submit">搜索</button>
      </form>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="status" id="status">准备加载…</div>
  <main id="content"></main>
</div>

<!-- 详情浮层 -->
<div class="sheet" id="detailSheet"><div class="sheet-inner"><div class="detail-panel" id="detailPanel"></div></div></div>

<script>
// ============================================================
// 兼容性 & 环境检测
// ============================================================
(function() {
  'use strict';
  if (window.fongmiBridge || window.fm || window.fongmi) {
    document.documentElement.classList.add('fm-native');
  }
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function() {
      this.innerHTML = '';
      for (var i = 0; i < arguments.length; i++) {
        var node = arguments[i];
        if (typeof node === 'string') node = document.createTextNode(node);
        this.appendChild(node);
      }
    };
  }
  if (!Object.values) {
    Object.values = function(obj) {
      var arr = [];
      for (var k in obj) if (obj.hasOwnProperty(k)) arr.push(obj[k]);
      return arr;
    };
  }
  if (!Object.entries) {
    Object.entries = function(obj) {
      var arr = [];
      for (var k in obj) if (obj.hasOwnProperty(k)) arr.push([k, obj[k]]);
      return arr;
    };
  }
  if (!Array.from) {
    Array.from = function(arrLike) { return Array.prototype.slice.call(arrLike); };
  }
  if (!Array.prototype.includes) {
    Array.prototype.includes = function(val) { return this.indexOf(val) !== -1; };
  }
  if (!NodeList.prototype.forEach) {
    NodeList.prototype.forEach = function(fn) {
      for (var i = 0; i < this.length; i++) fn(this[i], i);
    };
  }
  if (!String.prototype.includes) {
    String.prototype.includes = function(search, start) {
      return this.indexOf(search, start) !== -1;
    };
  }
  if (!String.prototype.startsWith) {
    String.prototype.startsWith = function(search, pos) {
      return this.substr(pos || 0, search.length) === search;
    };
  }
  if (!String.prototype.endsWith) {
    String.prototype.endsWith = function(search, len) {
      var end = len || this.length;
      return this.substring(end - search.length, end) === search;
    };
  }
  (function() {
    var test = document.createElement('div');
    test.style.display = 'flex';
    test.style.gap = '1px';
    document.body.appendChild(test);
    var computed = getComputedStyle(test).gap;
    document.body.removeChild(test);
    if (computed !== '1px') document.documentElement.classList.add('no-layout-gap');
  })();
  (function() {
    var supports = CSS.supports('width', 'min(1px,2px)');
    if (!supports) document.documentElement.classList.add('no-css-functions');
  })();
  (function() {
    var supports = CSS.supports('aspect-ratio', '1/1');
    if (!supports) { document.documentElement.classList.add('no-aspect-ratio'); return; }
    var test = document.createElement('div');
    test.style.aspectRatio = '1/1';
    test.style.width = '100px';
    document.body.appendChild(test);
    var height = test.offsetHeight;
    document.body.removeChild(test);
    if (height !== 100) document.documentElement.classList.add('no-aspect-ratio');
  })();
})();

// ============================================================
// 主脚本 — 爱瓜TV（PC站 API）
// ============================================================
(function() {
  'use strict';

  var BASE = 'https://aigua8.com';
  var CATS = [
    ['首页', '0'],
    ['电视剧', '2'],
    ['电影', '1'],
    ['综艺', '3'],
    ['动漫', '4'],
    ['纪录片', '32']
  ];
  var UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36';

  var content = document.getElementById('content');
  var statusEl = document.getElementById('status');
  var tabsEl = document.getElementById('tabs');
  var searchForm = document.getElementById('searchForm');
  var kwInput = document.getElementById('kw');
  var detailSheet = document.getElementById('detailSheet');
  var detailPanel = document.getElementById('detailPanel');

  var currentChannel = '0';
  var detailData = null;
  var lastFocus = null;

  // ===== 工具函数 =====
  function abs(url) {
    try { return new URL(url, BASE + '/').href; } catch(e) { return url || ''; }
  }
  function esc(s) {
    return String(s || '').replace(/[&<>'"]/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c] || c;
    });
  }
  function clean(s) {
    return String(s || '').replace(/\s+/g, ' ').trim();
  }
  function imgUrl(u) {
    u = abs(u || '');
    if (!u) return '';
    if (window.fm && fm.res) {
      try { return fm.res(u, { headers: { Referer: BASE + '/', 'User-Agent': UA } }); } catch(e) {}
    }
    return u;
  }
  function setStatus(msg) {
    statusEl.textContent = msg || '';
  }

  function whenFm() {
    if (window.fm) return Promise.resolve(window.fm);
    return new Promise(function(resolve) {
      window.addEventListener('fmsdk', function() { resolve(window.fm); }, { once: true });
      setTimeout(function() { resolve(window.fm || null); }, 1500);
    });
  }

  function reqText(url) {
    url = abs(url);
    setStatus('加载：' + url);
    var headers = {
      'User-Agent': UA,
      'Referer': BASE + '/',
      'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
      'Accept-Language': 'zh-CN,zh;q=0.9'
    };
    return new Promise(function(resolve, reject) {
      if (window.fm && fm.req) {
        fm.req(url, { method: 'GET', headers: headers, responseType: 'text', timeout: 25, credentials: 'include' })
          .then(function(r) {
            if (!r.ok) throw new Error(r.error || ('HTTP ' + r.status));
            return r.body || '';
          })
          .then(resolve)
          .catch(reject);
      } else {
        fetch(url, { headers: headers, cache: 'no-store' })
          .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(resolve)
          .catch(reject);
      }
    });
  }

  function reqJson(url) {
    url = abs(url);
    setStatus('请求API：' + url);
    var headers = {
      'User-Agent': UA,
      'Referer': BASE + '/',
      'Accept': 'application/json, text/plain, */*'
    };
    return new Promise(function(resolve, reject) {
      if (window.fm && fm.req) {
        fm.req(url, { method: 'GET', headers: headers, responseType: 'json', timeout: 25, credentials: 'include' })
          .then(function(r) {
            if (!r.ok) throw new Error(r.error || ('HTTP ' + r.status));
            return r.body || {};
          })
          .then(resolve)
          .catch(reject);
      } else {
        fetch(url, { headers: headers, cache: 'no-store' })
          .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(resolve)
          .catch(reject);
      }
    });
  }

  function doc(html) {
    return new DOMParser().parseFromString(html, 'text/html');
  }

  // ===== 卡片提取 =====
  function extractCard(li, isSearch) {
    var href = '';
    var link = li.querySelector('a');
    if (link) href = abs(link.getAttribute('href') || '');
    var img = li.querySelector('img');
    var image = img ? (img.getAttribute('src') || img.getAttribute('originalsrc') || '') : '';
    var titleEl = li.querySelector('.video-item-name, h5.video-item-name, h3.name, a[title]');
    var title = titleEl ? clean(titleEl.textContent) : '';
    if (!title && link) title = clean(link.getAttribute('title') || '');
    var remark = '';
    var remarkEl = li.querySelector('.mark, .video-item-play, .jidi span, .hdinfo .furk');
    if (remarkEl) remark = clean(remarkEl.textContent);
    if (isSearch) {
      var intro = li.querySelector('p.intro');
      if (intro) remark = clean(intro.textContent).slice(0, 30) + '…';
    }
    return { title: title, remark: remark, href: href, image: abs(image) };
  }

  function uniqueItems(arr) {
    var map = new Map();
    arr.forEach(function(x) {
      if (x && x.href && x.title && !map.has(x.href)) map.set(x.href, x);
    });
    return Array.from(map.values());
  }

  // ===== 首页解析（HTML） =====
  function parseHome(html) {
    var d = doc(html);
    var sections = [];
    var containers = d.querySelectorAll('.video-box-new .Movie-list');
    if (containers.length) {
      var items = [];
      containers.forEach(function(item) {
        var a = item.querySelector('a.Movie');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        var vod_id = href.split('=')[1] || '';
        var title = item.querySelector('a:last-child')?.textContent?.trim() || '';
        var pic = item.querySelector('img')?.getAttribute('originalsrc') || '';
        var remark = item.querySelector('.Movie-type02 div:last-child')?.textContent?.trim() || '';
        if (vod_id && title) {
          items.push({ title: title, remark: remark, href: '/video/detail?video_id=' + vod_id, image: abs(pic) });
        }
      });
      if (items.length) sections.push({ title: '热门推荐', items: items.slice(0, 20) });
    }
    if (!sections.length) {
      var lis = d.querySelectorAll('.video-list-box dd');
      var items2 = [];
      lis.forEach(function(li) {
        var card = extractCard(li, false);
        if (card.href && card.title) items2.push(card);
      });
      items2 = uniqueItems(items2).slice(0, 30);
      if (items2.length) sections.push({ title: '热门推荐', items: items2 });
    }
    if (!sections.length) {
      var lis3 = d.querySelectorAll('.bt_img ul li');
      var items3 = [];
      lis3.forEach(function(li) {
        var card = extractCard(li, false);
        if (card.href && card.title) items3.push(card);
      });
      items3 = uniqueItems(items3).slice(0, 30);
      if (items3.length) sections.push({ title: '热门推荐', items: items3 });
    }
    return sections;
  }

  // ===== 分类列表（API） =====
  function parseCategoryFromApi(data) {
    var items = [];
    try {
      var list = data.data && data.data.list;
      if (Array.isArray(list)) {
        list.forEach(function(item) {
          var video_id = item.video_id || '';
          var name = item.video_name || '';
          var cover = item.cover || '';
          var flag = item.flag || '';
          if (video_id && name) {
            items.push({
              title: name,
              remark: flag,
              href: '/video/detail?video_id=' + video_id,
              image: abs(cover)
            });
          }
        });
      }
    } catch(e) { console.warn('解析分类API失败', e); }
    return uniqueItems(items);
  }

  function parseSearchFromHtml(html) {
    var d = doc(html);
    var items = [];
    var boxes = d.querySelectorAll('.SSbox');

    boxes.forEach(function(box) {
      var a = box.querySelector('a');
      if (!a) return;
      
      var href = a.getAttribute('href') || '';
      var vid = href.split('=')[1] || '';
      
      var img = box.querySelector('img');
      var cover = img ? (img.getAttribute('originalsrc') || img.getAttribute('src') || '') : '';
      
      var spans = box.querySelectorAll('span');
      var name = Array.from(spans).map(function(s) { return s.textContent; }).join('').trim();
      if (!name && a) name = clean(a.textContent);
      
      var remarkEl = box.querySelector('.SSjgTitle');
      var remark = remarkEl ? clean(remarkEl.textContent) : '';

      if (vid && name) {
        items.push({
          title: name,
          remark: remark,
          href: '/video/detail?video_id=' + vid,
          image: abs(cover)
        });
      }
    });
    return uniqueItems(items);
  }

  // ===== 详情解析（HTML） =====
  function parseDetail(html, video_id) {
    var d = doc(html);
    var title = d.querySelector('h1')?.textContent?.trim() || '';
    if (!title) title = d.title.replace(/[|（].*$/, '').trim();

    var poster = '';
    var img = d.querySelector('.dyimg img');
    if (img) poster = abs(img.getAttribute('src') || '');
    if (!poster) {
      var meta = d.querySelector('meta[property="og:image"]');
      if (meta) poster = abs(meta.getAttribute('content') || '');
    }

    var desc = d.querySelector('.yp_context')?.textContent?.trim() || '';
    if (!desc) desc = d.querySelector('.desc')?.textContent?.trim() || '';
    if (!desc) desc = '暂无简介';

    var episodes = [];
    var playLists = d.querySelectorAll('ul[class*="qy-episode-num"], ul#srctab-1');
    playLists.forEach(function(ul) {
      var lis = ul.querySelectorAll('li');
      lis.forEach(function(li) {
        var nameEl = li.querySelector('a') || li.querySelector('span') || li;
        var name = clean(nameEl.textContent);
        if (!name) return;
        var chapterId = li.getAttribute('data-chapter-id') || '';
        if (!chapterId) {
          var a = li.querySelector('a');
          if (a) chapterId = a.getAttribute('data-id') || '';
        }
        if (!chapterId) {
          var span = li.querySelector('span');
          if (span) chapterId = span.getAttribute('data-chapter-id') || '';
        }
        if (name && chapterId) {
          episodes.push({ title: name, chapter_id: chapterId });
        }
      });
    });
    if (!episodes.length) {
      var bottom = d.querySelector('.video-detail-series-bottom');
      if (bottom) {
        var lis2 = bottom.querySelectorAll('li');
        lis2.forEach(function(li) {
          var name = clean(li.textContent);
          var chapterId = li.getAttribute('data-video-chapter-id') || '';
          if (name && chapterId) episodes.push({ title: name, chapter_id: chapterId });
        });
      }
    }
    var epMap = new Map();
    episodes.forEach(function(ep) {
      if (!epMap.has(ep.chapter_id)) epMap.set(ep.chapter_id, ep);
    });
    episodes = Array.from(epMap.values());
    episodes.sort(function(a, b) {
      var na = parseInt(a.title, 10) || 0;
      var nb = parseInt(b.title, 10) || 0;
      return na - nb;
    });

    var lines = [];
    var lineSpans = d.querySelectorAll('span.next-source');
    lineSpans.forEach(function(span) {
      var name = clean(span.textContent);
      var sourceId = span.getAttribute('data-source-id') || '';
      if (name && sourceId) lines.push({ name: name, source_id: sourceId });
    });
    if (!lines.length) {
      lines = [
        { name: '普快线路', source_id: '1' },
        { name: '超快线路', source_id: '21' }
      ];
    }

    var fields = [];
    var infoEl = d.querySelector('.moviedteail_list');
    if (infoEl) {
      var lis3 = infoEl.querySelectorAll('li');
      lis3.forEach(function(li) {
        var text = clean(li.textContent);
        if (text.includes('：')) {
          var parts = text.split('：');
          if (parts.length >= 2) fields.push([clean(parts[0]), parts.slice(1).join('：').trim()]);
        }
      });
    }

    return {
      title: title,
      image: poster,
      desc: desc,
      fields: fields,
      lines: lines,
      episodes: episodes,
      video_id: video_id
    };
  }

  // ===== 渲染函数 =====
  function renderTabs(active) {
    tabsEl.innerHTML = '';
    CATS.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'tab' + (cat[1] === active ? ' active' : '');
      btn.textContent = cat[0];
      btn.dataset.channel = cat[1];
      btn.onclick = function() {
        if (cat[1] === '0') loadHome();
        else loadCategory(cat[1]);
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderSections(sections) {
    if (!sections || !sections.length) {
      content.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }
    var html = '';
    sections.forEach(function(sec) {
      html += '<section class="section"><div class="section-title"><h2>' + esc(sec.title) + '</h2></div><div class="grid">';
      sec.items.forEach(function(it) {
        var vid = it.href.split('video_id=')[1] || '';
        html += '<article class="card" tabindex="0" data-href="' + esc(it.href) + '" data-vid="' + esc(vid) + '" data-poster="' + esc(it.image) + '" data-title="' + esc(it.title) + '">' +
          '<div class="poster">' +
          (it.image ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(imgUrl(it.image)) + '" alt="' + esc(it.title) + '">' : '<div class="noimg">📺</div>') +
          '</div>' +
          '<div class="meta"><div class="name">' + esc(it.title) + '</div><div class="remark">' + esc(it.remark || '') + '</div></div>' +
          '</article>';
      });
      html += '</div></section>';
    });
    content.innerHTML = html;
    content.querySelectorAll('.card').forEach(function(card) {
      card.onclick = function() {
        var vid = card.dataset.vid || card.dataset.href.split('video_id=')[1] || '';
        var poster = card.dataset.poster || '';
        var title = card.dataset.title || '';
        openDetail(vid, poster, title);
      };
      card.onkeydown = function(e) { if (e.key === 'Enter') card.click(); };
    });
    setTimeout(function() {
      var first = document.querySelector('.card');
      if (first) first.focus({ preventScroll: true });
    }, 50);
  }

  function renderList(items, title) {
    if (!items || !items.length) {
      content.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }
    var sections = [{ title: title || '列表', items: items }];
    renderSections(sections);
  }

  // ===== 加载首页 =====
  function loadHome() {
    currentChannel = '0';
    renderTabs('0');
    content.innerHTML = '<div class="empty loading">加载首页…</div>';
    reqText('/')
      .then(function(html) {
        var sections = parseHome(html);
        if (!sections.length) {
          return loadCategory('2', true);
        }
        renderSections(sections);
        var total = sections.reduce(function(sum, s) { return sum + s.items.length; }, 0);
        setStatus('首页加载完成，共 ' + total + ' 条');
      })
      .catch(function(err) {
        content.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
        setStatus('错误');
      });
  }

  // ===== 加载分类（API） =====
  function loadCategory(channel, silent) {
    currentChannel = channel;
    if (!silent) renderTabs(channel);
    if (!silent) content.innerHTML = '<div class="empty loading">加载中…</div>';
    var api = '/video/refresh-cate?channel_id=' + channel + '&page_num=1&page_size=28&sorttype=desc&tag=0&area=0&year=0&status=0&sort=new';
    return reqJson(api)
      .then(function(data) {
        var items = parseCategoryFromApi(data);
        if (!silent) {
          var title = CATS.find(function(c) { return c[1] === channel; });
          renderList(items, title ? title[0] : '分类');
          setStatus('分类加载完成，共 ' + items.length + ' 条');
        } else {
          if (items.length) {
            var sections = [{ title: '热门推荐', items: items.slice(0, 20) }];
            renderSections(sections);
            setStatus('首页加载完成（降级），共 ' + items.length + ' 条');
          } else {
            content.innerHTML = '<div class="empty">暂无内容</div>';
          }
        }
        return items;
      })
      .catch(function(err) {
        if (!silent) {
          content.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
          setStatus('错误');
        } else {
          content.innerHTML = '<div class="empty">首页加载失败</div>';
        }
        return [];
      });
  }

  // ===== 搜索（API） =====
  function search(keyword) {
    keyword = clean(keyword);
    if (!keyword) {
      loadHome();
      return;
    }
    renderTabs('');
    content.innerHTML = '<div class="empty loading">搜索中…</div>';
    var api = '/video/refresh-video?keyword=' + encodeURIComponent(keyword) + '&page_num=1&page_size=28&sorttype=desc&sort=new';
    
    reqText(api)
      .then(function(html) {
        var items = parseSearchFromHtml(html);
        if (!items.length) {
          content.innerHTML = '<div class="empty">未找到相关结果</div>';
          setStatus('无结果：' + keyword);
          return;
        }
        renderList(items, '搜索：' + keyword);
        setStatus('搜索完成，共 ' + items.length + ' 条');
      })
      .catch(function(err) {
        content.innerHTML = '<div class="empty">搜索失败：' + esc(err.message) + '</div>';
        setStatus('搜索失败');
      });
  }

  // ===== 详情浮层 =====
  function openDetail(video_id, poster, title) {
    if (!video_id) return;
    lastFocus = document.activeElement;
    document.body.classList.add('detail-active');
    detailSheet.classList.add('active');
    detailPanel.innerHTML = '<div class="empty loading">正在读取详情…</div>';
    history.pushState({ route: 'detail', vid: video_id }, '', '#detail=' + encodeURIComponent(video_id));

    var url = '/video/detail?video_id=' + video_id;
    reqText(url)
      .then(function(html) {
        var data = parseDetail(html, video_id);
        if (!data.image && poster) data.image = poster;
        if (!data.title && title) data.title = title;
        detailData = data;

        console.log('解析详情:', data);

        var fieldsHtml = '';
        data.fields.forEach(function(f) {
          fieldsHtml += '<div><b>' + esc(f[0]) + '：</b>' + esc(f[1]) + '</div>';
        });

        var linesHtml = '';
        if (data.lines.length) {
          data.lines.forEach(function(ln, idx) {
            linesHtml += '<button class="line-tab' + (idx === 0 ? ' active' : '') + '" data-source="' + esc(ln.source_id) + '">' + esc(ln.name) + '</button>';
          });
        } else {
          linesHtml = '<span class="line-tab active">默认线路</span>';
        }

        var epsHtml = '';
        if (data.episodes && data.episodes.length) {
          data.episodes.forEach(function(ep) {
            epsHtml += '<button class="ep" data-chapter="' + esc(ep.chapter_id) + '">' + esc(ep.title) + '</button>';
          });
        } else {
          epsHtml = '<div class="empty">暂无剧集</div>';
        }

        detailPanel.innerHTML = 
          '<button id="closeDetail">返回</button>' +
          '<div class="detail-head">' +
          (data.image ? '<img class="detail-pic" referrerpolicy="no-referrer" src="' + esc(imgUrl(data.image)) + '" onerror="this.style.display=\'none\'">' : '') +
          '<div class="detail-side">' +
          '<div class="detail-title">' + esc(data.title) + '</div>' +
          '<div class="detail-info">' + fieldsHtml + '</div>' +
          '</div></div>' +
          '<div class="intro-pill">📖 简介</div>' +
          '<p class="desc">' + esc(data.desc) + '</p>' +
          '<div class="play-title">🎬 播放线路</div>' +
          '<div class="line-tabs">' + linesHtml + '</div>' +
          '<div class="play-title">📺 选集</div>' +
          '<div class="episodes" id="episodeBox">' + epsHtml + '</div>';

        document.getElementById('closeDetail').onclick = closeDetail;

        detailPanel.querySelectorAll('.line-tab').forEach(function(btn) {
          btn.onclick = function() {
            detailPanel.querySelectorAll('.line-tab').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
          };
        });

        detailPanel.querySelectorAll('.ep').forEach(function(btn) {
          btn.onclick = function() {
            var chapter = btn.dataset.chapter;
            if (!chapter) return;
            var activeLine = detailPanel.querySelector('.line-tab.active');
            var sourceId = activeLine ? activeLine.dataset.source : (data.lines[0] ? data.lines[0].source_id : '1');
            playEpisode(video_id, chapter, sourceId, data.title);
          };
        });

        document.getElementById('closeDetail').focus({ preventScroll: true });
      })
      .catch(function(err) {
        detailPanel.innerHTML = '<button id="closeDetail" onclick="window.__wbClose()">返回</button><div class="empty">详情加载失败：' + esc(err.message) + '</div>';
        document.getElementById('closeDetail').onclick = closeDetail;
      });
  }

  // ===== 播放 =====
  function playEpisode(video_id, chapter_id, source_id, title) {
    setStatus('正在获取播放地址…');
    var api = '/video/play-url?videoId=' + video_id + '&chapterId=' + chapter_id + '&sourceId=0&citycode=HKG';

    reqJson(api).then(function(data) {
      var playUrl = '';
      try {
        var resource = data && data.data && data.data.urlinfo && data.data.urlinfo.resource_url;
        if (resource) {
          if (resource[source_id]) {
            playUrl = resource[source_id];
          } else {
            var keys = Object.keys(resource);
            if (keys.length) playUrl = resource[keys[0]];
          }
        }
      } catch(e) { console.warn('解析播放地址失败', e); }

      if (!playUrl) {
        setStatus('未获取到播放地址');
        return;
      }

      setStatus('正在播放：' + (title || '影片'));
      console.log('播放地址:', playUrl);

      var fmObj = window.fm || window.fongmi || window.fongmiBridge;
      if (fmObj && typeof fmObj.play === 'function') {
        fmObj.play(playUrl);
      } else {
        location.href = playUrl;
      }
    }).catch(function(err) {
      console.error('获取播放地址失败', err);
      setStatus('获取播放地址失败');
    });
  }

  function closeDetail() {
    document.body.classList.remove('detail-active');
    detailSheet.classList.remove('active');
    if (location.hash.startsWith('#detail=')) history.back();
    if (lastFocus && lastFocus.focus) setTimeout(function() { lastFocus.focus({ preventScroll: true }); }, 50);
  }
  window.__wbClose = closeDetail;

  // ===== 键盘事件 =====
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Backspace') {
      if (detailSheet.classList.contains('active')) {
        e.preventDefault();
        closeDetail();
        return;
      }
    }
    if (e.key === 'Enter') {
      var active = document.activeElement;
      if (active && active.classList && active.classList.contains('card')) {
        active.click();
      }
    }
  }, true);

  // ===== 初始化 =====
  function boot() {
    setStatus('初始化…');
    renderTabs('0');
    searchForm.onsubmit = function(e) {
      e.preventDefault();
      search(kwInput.value);
    };
    window.addEventListener('popstate', function() {
      if (detailSheet.classList.contains('active')) {
        closeDetail();
      } else {
        loadHome();
      }
    });
    loadHome();
  }

  whenFm().then(function() {
    boot();
  }).catch(function() {
    boot();
  });

})();
</script>
</body>
</html>
