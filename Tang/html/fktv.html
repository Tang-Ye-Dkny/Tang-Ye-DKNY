<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>凡客影视 WebHome</title>
<style>
  /* === 基本样式（保持透明背景、半透明卡片、响应式） === */
  :root{--panel-rgb:42,50,58;--panel:rgba(var(--panel-rgb),0.62);--panel-soft:rgba(var(--panel-rgb),0.44);--panel-strong:rgba(var(--panel-rgb),0.86);--line:rgba(255,255,255,0.16);--text:#f7fbff;--muted:rgba(247,251,255,0.68);--accent:#ff6b35;--accent2:#ffb86b;--radius:16px;--shadow:0 12px 40px rgba(0,0,0,0.3)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  html:not(.fm-native) body{background:#1e242a}
  .app{min-height:100vh;background:transparent;padding:8px 10px 30px}
  .top{position:relative;z-index:1;padding:6px 0 8px;border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:6px}
  .brand{flex:0 0 auto;font-size:20px;font-weight:900;letter-spacing:0.3px}
  .brand b{color:var(--accent2)}
  .search{flex:1;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:4px 5px 4px 12px}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:15px}
  .search input::placeholder{color:var(--muted)}
  .btn{background:var(--panel-soft);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,rgba(255,107,53,0.85),rgba(255,184,107,0.7));border-color:rgba(255,184,107,0.6);color:#17110d;font-weight:700}
  .tabs{display:flex;gap:6px;overflow:auto;padding:8px 2px 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--muted);cursor:pointer}
  .tab.active{background:linear-gradient(135deg,rgba(255,107,53,0.45),rgba(255,184,107,0.25));color:var(--text);border-color:rgba(255,184,107,0.6);font-weight:700}
  .status{margin:8px 2px 6px;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .card{position:relative;min-width:0;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.04));border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform 0.15s}
  .card:focus,.card:hover{transform:translateY(-2px);outline:2px solid var(--accent2);outline-offset:2px}
  .poster{aspect-ratio:3/4;background:rgba(255,255,255,0.06);overflow:hidden;position:relative}
  .poster img{width:100%;height:100%;object-fit:cover;display:block}
  .poster .noimg{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
  .meta{padding:6px 8px 8px}
  .name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .remark{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .section{margin:14px 0}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
  .section-title h2{margin:0;font-size:16px;letter-spacing:0.2px}
  .empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--panel-soft);border:1px dashed var(--line);border-radius:var(--radius)}
  .loading{opacity:0.7}
  /* 响应式 */
  @media(min-width:720px){.grid{grid-template-columns:repeat(5,1fr)}.app{padding:16px 30px 40px}}
  @media(min-width:1100px){.grid{grid-template-columns:repeat(7,1fr)}.app{max-width:1380px;margin:0 auto}}
  @media(max-width:480px){.app{padding:6px 6px 20px}.grid{grid-template-columns:repeat(3,1fr);gap:6px}.meta{padding:5px 6px 6px}.name{font-size:12px}.remark{font-size:10px}}
  /* 降级类 */
  html.no-layout-gap .grid{gap:6px}
  html.no-aspect-ratio .poster{height:0;padding-bottom:133.33%;position:relative}
  html.no-aspect-ratio .poster img{position:absolute;top:0;left:0;width:100%;height:100%}
  html.no-css-functions .detail-panel{border-radius:14px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="bar">
      <div class="brand">凡客<b>影视</b></div>
      <form class="search" id="searchForm">
        <input id="kw" type="text" placeholder="搜索影片、剧集…" autocomplete="off" />
        <button class="btn primary" type="submit">搜索</button>
      </form>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="status" id="status">准备加载…</div>
  <main id="content"></main>
</div>

<script>
// ============================================================
// 兼容引导层 (ES5 + polyfill + 特性检测)
// ============================================================
(function() {
  'use strict';
  if (window.fongmiBridge || window.fm || window.fongmi) {
    document.documentElement.classList.add('fm-native');
  }
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function() {
      this.innerHTML = '';
      for (var i = 0; i < arguments.length; i++) {
        var node = arguments[i];
        if (typeof node === 'string') node = document.createTextNode(node);
        this.appendChild(node);
      }
    };
  }
  if (!Object.values) {
    Object.values = function(obj) {
      var arr = [];
      for (var k in obj) if (obj.hasOwnProperty(k)) arr.push(obj[k]);
      return arr;
    };
  }
  if (!Object.entries) {
    Object.entries = function(obj) {
      var arr = [];
      for (var k in obj) if (obj.hasOwnProperty(k)) arr.push([k, obj[k]]);
      return arr;
    };
  }
  if (!Array.from) {
    Array.from = function(arrLike) { return Array.prototype.slice.call(arrLike); };
  }
  if (!Array.prototype.includes) {
    Array.prototype.includes = function(val) { return this.indexOf(val) !== -1; };
  }
  if (!NodeList.prototype.forEach) {
    NodeList.prototype.forEach = function(fn) {
      for (var i = 0; i < this.length; i++) fn(this[i], i);
    };
  }
  if (!String.prototype.includes) {
    String.prototype.includes = function(search, start) {
      return this.indexOf(search, start) !== -1;
    };
  }
  if (!String.prototype.startsWith) {
    String.prototype.startsWith = function(search, pos) {
      return this.substr(pos || 0, search.length) === search;
    };
  }
  if (!String.prototype.endsWith) {
    String.prototype.endsWith = function(search, len) {
      var end = len || this.length;
      return this.substring(end - search.length, end) === search;
    };
  }
  (function() {
    var test = document.createElement('div');
    test.style.display = 'flex';
    test.style.gap = '1px';
    document.body.appendChild(test);
    var computed = getComputedStyle(test).gap;
    document.body.removeChild(test);
    if (computed !== '1px') document.documentElement.classList.add('no-layout-gap');
  })();
  (function() {
    var supports = CSS.supports('width', 'min(1px,2px)');
    if (!supports) document.documentElement.classList.add('no-css-functions');
  })();
  (function() {
    var supports = CSS.supports('aspect-ratio', '1/1');
    if (!supports) { document.documentElement.classList.add('no-aspect-ratio'); return; }
    var test = document.createElement('div');
    test.style.aspectRatio = '1/1';
    test.style.width = '100px';
    document.body.appendChild(test);
    var height = test.offsetHeight;
    document.body.removeChild(test);
    if (height !== 100) document.documentElement.classList.add('no-aspect-ratio');
  })();
})();

// ============================================================
// 主脚本 (ES2017) — 静态首页 + 跳转详情
// ============================================================
(function() {
  'use strict';

  var BASE = 'https://m.fktv.me';
  var CATS = [
    ['首页', '/'],
    ['电影', '/channel/movie'],
    ['电视剧', '/channel/tv'],
    ['动漫', '/channel/comic'],
    ['综艺', '/channel/zy'],
    ['短剧', '/channel/short_tv'],
    ['纪录片', '/channel/jlp'],
    ['电影解说', '/channel/js']
  ];
  var UA = 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36';

  var content = document.getElementById('content');
  var statusEl = document.getElementById('status');
  var tabsEl = document.getElementById('tabs');
  var searchForm = document.getElementById('searchForm');
  var kwInput = document.getElementById('kw');

  var currentUrl = BASE + '/';

  function abs(url) {
    try { return new URL(url, BASE + '/').href; } catch(e) { return url || ''; }
  }
  function esc(s) {
    return String(s || '').replace(/[&<>'"]/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c] || c;
    });
  }
  function clean(s) {
    return String(s || '').replace(/\s+/g, ' ').trim();
  }
  function imgUrl(u) {
    u = abs(u || '');
    if (!u) return '';
    if (window.fm && fm.res) {
      try { return fm.res(u, { headers: { Referer: BASE + '/', 'User-Agent': UA } }); } catch(e) {}
    }
    return u;
  }
  function setStatus(msg) {
    statusEl.textContent = msg || '';
  }

  function whenFm() {
    if (window.fm) return Promise.resolve(window.fm);
    return new Promise(function(resolve) {
      window.addEventListener('fmsdk', function() { resolve(window.fm); }, { once: true });
      setTimeout(function() { resolve(window.fm || null); }, 1500);
    });
  }

  function reqText(url) {
    url = abs(url);
    setStatus('加载：' + url);
    var headers = {
      'User-Agent': UA,
      'Referer': BASE + '/',
      'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
      'Accept-Language': 'zh-CN,zh;q=0.9'
    };
    return new Promise(function(resolve, reject) {
      if (window.fm && fm.req) {
        fm.req(url, { method: 'GET', headers: headers, responseType: 'text', timeout: 25, credentials: 'include' })
          .then(function(r) {
            if (!r.ok) throw new Error(r.error || ('HTTP ' + r.status));
            return r.body || '';
          })
          .then(resolve)
          .catch(reject);
      } else {
        fetch(url, { headers: headers, cache: 'no-store' })
          .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(resolve)
          .catch(reject);
      }
    });
  }

  function doc(html) {
    return new DOMParser().parseFromString(html, 'text/html');
  }

  // 卡片提取
  function cardFromA(a) {
    var href = abs(a.getAttribute('href') || '');
    var img = a.querySelector('img');
    var image = img ? (img.getAttribute('data-src') || img.getAttribute('data-original') || img.getAttribute('src') || '') : '';
    var title = a.getAttribute('title') || (img ? img.getAttribute('alt') : '') || '';
    var text = clean(a.textContent);
    if (!title) {
      title = text.replace(/^(4K)?(今日更新)?(更新至|已完结|HD|全).*?/, '').slice(0, 24) || text;
    }
    var remark = text.replace(title, '').slice(0, 40);
    return { title: clean(title), remark: clean(remark), href: href, image: abs(image) };
  }

  function uniqueItemsArr(arr) {
    var map = new Map();
    arr.forEach(function(x) {
      if (x && x.href && x.title && !map.has(x.href)) map.set(x.href, x);
    });
    return Array.from(map.values());
  }

  // 解析首页/分类列表
  function parseList(html, keyword) {
    var d = doc(html);
    var sections = [];
    var badHost = function(el) {
      return !!el.closest('.pop-list-body,.search-hot,.history,.footer,.head-more,.slide-time,.banner,.swiper,.large-swiper,.popup');
    };
    var isGood = function(x) {
      return x && x.href && x.title && x.image && !/^点击观看$/.test(x.title);
    };
    var heads = d.querySelectorAll('.title-a,.module-title,.title');
    var headList = [];
    heads.forEach(function(h) {
      var t = clean(h.textContent).replace('更多', '');
      if (t && !/搜索|播放记录|搜索历史|热门搜索|更多/.test(t)) {
        headList.push({ el: h, title: t });
      }
    });
    headList.forEach(function(item) {
      var box = item.el.closest('.box-width,.module,.module-main,.layout-box,.box') || item.el.parentElement;
      var items = [];
      for (var i = 0; i < 4 && box; i++) {
        var links = box.querySelectorAll('a[href*="/movie/"]');
        var arr = [];
        links.forEach(function(a) {
          if (!badHost(a)) arr.push(cardFromA(a));
        });
        items = uniqueItemsArr(arr).filter(isGood).slice(0, 24);
        if (items.length >= 3) break;
        box = box.parentElement;
      }
      if (items.length) sections.push({ title: item.title, items: items });
    });
    if (!sections.length) {
      var allLinks = d.querySelectorAll('a[href*="/movie/"]');
      var allItems = [];
      allLinks.forEach(function(a) {
        if (!badHost(a)) allItems.push(cardFromA(a));
      });
      allItems = uniqueItemsArr(allItems).filter(isGood);
      if (keyword) {
        allItems = allItems.filter(function(x) {
          return x.title.indexOf(keyword) !== -1 || x.remark.indexOf(keyword) !== -1;
        });
      }
      allItems = allItems.slice(0, 60);
      if (allItems.length) {
        sections.push({ title: keyword ? ('搜索：' + keyword) : '影片列表', items: allItems });
      }
    }
    return sections;
  }

  // 渲染卡片
  function renderTabs(active) {
    tabsEl.innerHTML = '';
    CATS.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'tab' + (abs(cat[1]) === abs(active) ? ' active' : '');
      btn.textContent = cat[0];
      btn.dataset.url = abs(cat[1]);
      btn.onclick = function() { loadPage(btn.dataset.url); };
      tabsEl.appendChild(btn);
    });
  }

  function renderSections(sections) {
    if (!sections || !sections.length) {
      content.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }
    var html = '';
    sections.forEach(function(sec) {
      html += '<section class="section"><div class="section-title"><h2>' + esc(sec.title) + '</h2></div><div class="grid">';
      sec.items.forEach(function(it) {
        html += '<article class="card" tabindex="0" data-href="' + esc(it.href) + '">' +
          '<div class="poster">' +
          (it.image ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(imgUrl(it.image)) + '" alt="' + esc(it.title) + '">' : '<div class="noimg">📺</div>') +
          '</div>' +
          '<div class="meta"><div class="name">' + esc(it.title) + '</div><div class="remark">' + esc(it.remark || '点击查看详情') + '</div></div>' +
          '</article>';
      });
      html += '</div></section>';
    });
    content.innerHTML = html;
    // 点击卡片直接跳转原站详情页
    content.querySelectorAll('.card').forEach(function(card) {
      card.onclick = function() {
        location.href = card.dataset.href; // 跳转原站
      };
      card.onkeydown = function(e) { if (e.key === 'Enter') card.click(); };
    });
    // 焦点
    setTimeout(function() {
      var first = document.querySelector('.card');
      if (first) first.focus({ preventScroll: true });
    }, 50);
  }

  // 加载页面
  function loadPage(url) {
    currentUrl = abs(url);
    renderTabs(currentUrl);
    content.innerHTML = '<div class="empty loading">加载中…</div>';
    reqText(currentUrl)
      .then(function(html) {
        var sections = parseList(html);
        renderSections(sections);
        var total = sections.reduce(function(sum, s) { return sum + s.items.length; }, 0);
        setStatus('已加载 ' + total + ' 条内容');
      })
      .catch(function(err) {
        content.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
        setStatus('错误');
      });
  }

  // 搜索
  function search(q) {
    q = clean(q);
    if (!q) return;
    renderTabs('');
    content.innerHTML = '<div class="empty loading">搜索中…</div>';
    var searchUrl = BASE + '/channel?keywords=' + encodeURIComponent(q);
    reqText(searchUrl)
      .then(function(html) {
        var sections = parseList(html, q);
        if (!sections.length || !sections[0].items.length) {
          content.innerHTML = '<div class="empty">未找到相关结果</div>';
          setStatus('无结果：' + q);
          return;
        }
        sections[0].title = '搜索：' + q;
        renderSections(sections);
        setStatus('搜索完成：' + q);
      })
      .catch(function(err) {
        content.innerHTML = '<div class="empty">搜索失败，请重试</div>';
        setStatus('搜索失败');
      });
  }

  // 初始化
  function boot() {
    setStatus('正在初始化…');
    renderTabs(BASE + '/');
    searchForm.onsubmit = function(e) {
      e.preventDefault();
      search(kwInput.value);
    };
    // 监听返回事件（如果是从详情页返回，刷新当前列表）
    window.addEventListener('popstate', function() {
      loadPage(currentUrl);
    });
    loadPage(BASE + '/');
  }

  whenFm().then(function() {
    boot();
  }).catch(function() {
    boot();
  });

})();
</script>
</body>
</html>
