<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>华视影院 WebHome</title>
<style>
  /* 样式与之前相同，为节省篇幅省略，可沿用之前版本 */
  :root{--panel-rgb:42,50,58;--panel:rgba(var(--panel-rgb),.62);--panel-soft:rgba(var(--panel-rgb),.44);--panel-strong:rgba(var(--panel-rgb),.86);--line:rgba(255,255,255,.16);--text:#f7fbff;--muted:rgba(247,251,255,.68);--accent:#6c5ce7;--accent2:#a29bfe;--bad:#ff5c7a;--ok:#68e39a;--radius:18px;--shadow:0 18px 50px rgba(0,0,0,.28)}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif} html:not(.fm-native),html:not(.fm-native) body{background:#222a32}.app{min-height:100vh;background:transparent;padding:10px 10px 28px}.top{position:relative;z-index:1;background:transparent;backdrop-filter:none;padding:8px 0 10px;border-bottom:0}.bar{display:flex;align-items:center;gap:8px}.brand{flex:0 0 auto;font-size:21px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 14px rgba(0,0,0,.35)}.brand b{color:var(--accent2)}.search{flex:1;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 7px 6px 13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:15px}.search input::placeholder{color:var(--muted)}button,.btn{border:1px solid var(--line);background:var(--panel-soft);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}.btn.primary,button.primary{border-color:rgba(255,107,53,.45);background:linear-gradient(135deg,rgba(255,107,53,.90),rgba(255,184,107,.72));color:#17110d;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 2px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--muted)}.tab.active{background:linear-gradient(135deg,rgba(255,107,53,.55),rgba(255,184,107,.30));color:var(--text);border-color:rgba(255,184,107,.58);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{position:relative;min-width:0;border-radius:15px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(0,0,0,.22);cursor:pointer}.poster{aspect-ratio:3/4;background:rgba(255,255,255,.08);overflow:hidden;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.meta{padding:8px 8px 10px;background:linear-gradient(180deg,rgba(18,24,30,.15),rgba(18,24,30,.44))}.name{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remark{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{margin:16px 0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.section-title h2{margin:0;font-size:17px;letter-spacing:.3px}.detail-panel{background:linear-gradient(135deg,rgba(40,30,64,.68),rgba(24,20,42,.54));border:1px solid rgba(255,255,255,.10);border-radius:22px;box-shadow:var(--shadow);padding:18px 14px 22px;margin-bottom:42px}.detail-head{display:grid;grid-template-columns:38% 1fr;gap:16px;align-items:start}.detail-pic{width:100%;aspect-ratio:3/4;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.08)}.detail-title{font-size:22px;font-weight:600;margin:0 0 8px;line-height:1.25}.detail-info{font-size:14px;color:var(--muted);line-height:1.6}.desc{font-size:15px;color:var(--muted);line-height:1.75;margin:12px 0}.line-tabs{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.line-tab{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);cursor:pointer;white-space:nowrap}.line-tab.active{background:rgba(255,184,107,.3);border-color:var(--accent2)}.episodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.ep{padding:8px 4px;text-align:center;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer}.empty{padding:30px 18px;text-align:center;color:var(--muted)}.focusable:focus{outline:2px solid rgba(255,184,107,.76);outline-offset:2px}
  @media (min-width:720px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.detail-head{grid-template-columns:160px 1fr}.detail-pic{width:160px}}
  @media (max-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="top">
    <div class="bar">
      <div class="brand">华视<b>影院</b></div>
      <form class="search" id="searchForm">
        <input id="kw" type="text" placeholder="搜索影片..." autocomplete="off" />
        <button class="primary" type="submit">搜索</button>
      </form>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="status" id="status">加载中…</div>
  <main id="content"></main>
</div>

<!-- 详情浮层 -->
<div id="detailSheet" style="position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.85);overflow-y:auto;padding:20px;">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
(function(){
'use strict';

// ============ 配置 ============
const BASE = 'https://huavod.com';
const UA = 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36';
const CATS = [
  ['电影', '/vodshow/1--------1---.html'],
  ['电视剧', '/vodshow/2--------1---.html'],
  ['综艺', '/vodshow/3--------1---.html'],
  ['动漫', '/vodshow/4--------1---.html'],
  ['短剧', '/vodshow/5--------1---.html'],
  ['纪录片', '/vodshow/42--------1---.html']
];

let currentUrl = BASE + CATS[0][1];
let currentPage = 1;
let lastFocus = null;

// ============ DOM 引用 ============
const $ = s => document.querySelector(s);
const content = $('#content');
const status = $('#status');
const tabs = $('#tabs');
const detailSheet = $('#detailSheet');
const detailPanel = $('#detailPanel');

// ============ 工具函数 ============
function abs(u){ try{ return new URL(u, BASE).href } catch(e){ return u || '' } }
function esc(s){ return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])) }
function clean(s){ return String(s||'').replace(/\s+/g,' ').trim() }
function imgUrl(u){ u=abs(u||''); if(!u) return ''; try{ return window.fm && fm.res ? fm.res(u, {headers:{Referer:BASE+'/', 'User-Agent':UA}}) : u } catch(e){ return u } }

function waitFm(){ if(window.fm) return Promise.resolve(window.fm); return new Promise(r=>{ window.addEventListener('fmsdk', ()=>r(window.fm), {once:true}); setTimeout(()=>r(window.fm), 2000); }); }

async function reqText(url){
  url = abs(url);
  status.textContent = '加载：' + url;
  const headers = {'User-Agent':UA, 'Referer':BASE+'/', 'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'};
  try {
    if(window.fm && fm.req){
      let r = await fm.req(url, {method:'GET', headers, responseType:'text', timeout:20, credentials:'include'});
      if(!r.ok) throw new Error(r.error || ('HTTP '+r.status));
      return r.body || '';
    }
    let r = await fetch(url, {headers, cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.text();
  } catch(e){ status.textContent = '加载失败：'+e.message; throw e; }
}

function doc(html){ return new DOMParser().parseFromString(html, 'text/html'); }

// ============ 广告清理（外层） ============
function removeOuterAds(){
  try {
    document.querySelectorAll('img[src*="static.okokserver.com/img/"]').forEach(function(img){
      var container = img.closest('a, div[class*="ad"], div[class*="banner"], .love-item, .player-right .switch-box, .check, .plist-body, #player-vip, .ucl-final-banner, .love-row-wrap');
      if(container) container.style.display = 'none';
      else img.style.display = 'none';
    });
    document.querySelectorAll('.love-row-wrap, .love-item, #player-vip, .ucl-final-banner, .player-news, .switch-box .item img[src*="okokserver"]').forEach(function(el){
      if(el) el.style.display = 'none';
    });
    document.querySelectorAll('img[src$=".gif"]').forEach(function(img){
      var container = img.closest('a, div');
      if(container) container.style.display = 'none';
    });
  } catch(e){}
}
function watchOuterAds(){
  removeOuterAds();
  var mo = new MutationObserver(function(){ removeOuterAds(); });
  mo.observe(document.body, { childList: true, subtree: true });
}

// ============ 解析函数 ============
function parseVodList(html){
  const d = doc(html);
  const items = [];
  d.querySelectorAll('.public-list-box, .vod-list-item, .module-item').forEach(box => {
    const a = box.querySelector('a[href*="/voddetail/"]');
    if(!a) return;
    const href = abs(a.getAttribute('href'));
    const img = box.querySelector('img');
    const image = img ? (img.getAttribute('data-src') || img.getAttribute('src') || '') : '';
    const title = a.getAttribute('title') || a.textContent.trim() || '';
    const remark = box.querySelector('.public-list-prb, .remarks, .vod-remarks')?.textContent || '';
    if(title && href) items.push({ title:clean(title), remark:clean(remark), href, image:abs(image) });
  });
  return items;
}

function parseDetail(html){
  const d = doc(html);
  const title = d.querySelector('h1.vod-title-seo, h1')?.textContent?.replace(/ - .*$/, '').trim() || '未知影片';
  const pic = d.querySelector('img[data-src]')?.getAttribute('data-src') || d.querySelector('.detail-pic img')?.src || '';
  const desc = d.querySelector('.vod_content, .content_desc, .detail-content')?.textContent?.trim() || '暂无简介';
  const lineTabs = d.querySelectorAll('.anthology-tab a');
  const lineNames = [];
  lineTabs.forEach(a => { const name = a.textContent.trim(); if(name) lineNames.push(name); });
  if(lineNames.length === 0) lineNames.push('默认线路');
  const listBoxes = d.querySelectorAll('.anthology-list-box, .episode-list, .play-list');
  const lines = [];
  listBoxes.forEach((box, idx) => {
    const eps = [];
    box.querySelectorAll('a').forEach(a => {
      const href = abs(a.getAttribute('href') || '');
      const name = a.textContent.trim();
      if(href && name) eps.push({ name, href });
    });
    if(eps.length) lines.push({ name: lineNames[idx] || ('线路'+(idx+1)), eps });
  });
  if(lines.length === 0){
    const eps = [];
    d.querySelectorAll('a[href*="/vodplay/"]').forEach(a => {
      const href = abs(a.href);
      const name = a.textContent.trim();
      if(href && name) eps.push({ name, href });
    });
    if(eps.length) lines.push({ name: '默认线路', eps });
  }
  return { title, pic:abs(pic), desc, lines };
}

// ============ 渲染 ============
function renderTabs(activeUrl){
  tabs.innerHTML = CATS.map(([n,path]) => `<button class="tab ${abs(path)===abs(activeUrl)?'active':''}" data-url="${abs(path)}">${esc(n)}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => b.onclick = ()=>loadCategory(b.dataset.url, 1));
}

function renderSections(items, title='影片列表'){
  if(!items || items.length === 0){
    content.innerHTML = '<div class="empty">暂无内容</div>';
    return;
  }
  content.innerHTML = `
    <section class="section">
      <div class="section-title"><h2>${esc(title)}</h2></div>
      <div class="grid">
        ${items.map(it => `
          <article class="card focusable" data-href="${esc(it.href)}">
            <div class="poster">${it.image ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(imgUrl(it.image))}" alt="${esc(it.title)}">` : '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)">华</div>'}</div>
            <div class="meta"><div class="name">${esc(it.title)}</div><div class="remark">${esc(it.remark)}</div></div>
          </article>
        `).join('')}
      </div>
    </section>
  `;
  content.querySelectorAll('.card').forEach(c => c.onclick = ()=>openDetail(c.dataset.href));
}

// ============ 加载分类 ============
async function loadCategory(url, page){
  currentUrl = abs(url);
  currentPage = page;
  renderTabs(currentUrl);
  content.innerHTML = '<div class="empty">加载中…</div>';
  try {
    let pageUrl = currentUrl.replace(/---\.html$/, `---${page}.html`);
    if(!pageUrl.includes(`---${page}.html`)) pageUrl = currentUrl + (currentUrl.includes('?')?'&':'?') + 'page='+page;
    const html = await reqText(pageUrl);
    const items = parseVodList(html);
    if(items.length === 0) { content.innerHTML = '<div class="empty">暂无内容</div>'; return; }
    renderSections(items, '分类列表');
    status.textContent = `第 ${page} 页，共 ${items.length} 条`;
  } catch(e){ content.innerHTML = '<div class="empty">加载失败</div>'; }
}

// ============ 搜索 ============
async function search(q){
  q = clean(q); if(!q) return;
  content.innerHTML = '<div class="empty">搜索中…</div>';
  try {
    const url = `${BASE}/vodsearch.html?wd=${encodeURIComponent(q)}&page=1`;
    const html = await reqText(url);
    const items = parseVodList(html);
    if(!items.length) { content.innerHTML = '<div class="empty">未找到相关结果</div>'; return; }
    renderSections(items, '搜索结果：'+q);
  } catch(e){ content.innerHTML = '<div class="empty">搜索失败</div>'; }
}

// ============ 详情 ============
async function openDetail(url){
  lastFocus = document.activeElement;
  detailSheet.style.display = 'block';
  detailPanel.innerHTML = '<div class="empty">加载详情…</div>';
  try {
    const html = await reqText(url);
    const detail = parseDetail(html);
    let firstLine = detail.lines[0] || { name:'默认线路', eps:[] };

    detailPanel.innerHTML = `
      <button id="closeDetail" class="btn" style="margin-bottom:12px;">← 返回</button>
      <div class="detail-head">
        <img class="detail-pic" referrerpolicy="no-referrer" src="${esc(imgUrl(detail.pic))}" onerror="this.style.display='none'">
        <div>
          <div class="detail-title">${esc(detail.title)}</div>
          <div class="detail-info">${esc(detail.desc)}</div>
        </div>
      </div>
      <div class="play-title">播放线路</div>
      <div class="line-tabs" id="lineTabs">
        ${detail.lines.map((ln,i) => `<button class="line-tab ${i===0?'active':''}" data-line="${i}">${esc(ln.name)} (${ln.eps.length})</button>`).join('')}
      </div>
      <div class="episodes" id="epGrid"></div>
    `;

    function renderLine(idx){
      const line = detail.lines[idx] || firstLine;
      const grid = document.getElementById('epGrid');
      if(!grid) return;
      grid.innerHTML = line.eps.map(ep => `<button class="ep focusable" data-href="${esc(ep.href)}">${esc(ep.name)}</button>`).join('');
      grid.querySelectorAll('.ep').forEach(b => b.onclick = ()=>playEpisode(b.dataset.href, detail.title + ' ' + b.textContent));
    }
    renderLine(0);

    document.querySelectorAll('.line-tab').forEach(b => {
      b.onclick = function(){
        document.querySelectorAll('.line-tab').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        renderLine(parseInt(this.dataset.line));
      };
    });

    document.getElementById('closeDetail').onclick = ()=>{
      detailSheet.style.display = 'none';
      if(lastFocus) lastFocus.focus();
    };

  } catch(e){ detailPanel.innerHTML = '<div class="empty">详情加载失败</div>'; }
}

// ============ 播放核心（无 iframe，直接解析） ============
async function playEpisode(url, title){
  // 关闭详情浮层
  detailSheet.style.display = 'none';
  status.textContent = '正在解析播放地址…';

  try {
    // 1. 获取播放页 HTML
    const html = await reqText(url);
    // 2. 提取 player_aaaa 对象
    const match = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*<\/script>/);
    if (!match) {
      status.textContent = '未找到播放数据';
      return;
    }
    let playerData;
    try {
      // 替换可能的转义字符并解析
      playerData = JSON.parse(match[1].replace(/\\\//g, '/'));
    } catch(e) {
      status.textContent = '解析播放数据失败';
      return;
    }

    // 3. 获取视频地址
    let playUrl = playerData.url || '';
    if (!playUrl) {
      status.textContent = '未获取到播放地址';
      return;
    }
    // 如果是相对路径，补全
    if (playUrl.startsWith('//')) playUrl = 'https:' + playUrl;
    else if (playUrl.startsWith('/')) playUrl = BASE + playUrl;

    // 4. 如果地址不是 .m3u8，可能是页面，需要进一步请求（但华视通常直接是 m3u8）
    if (playUrl.includes('.m3u8')) {
      // 直接播放
      const fm = await waitFm();
      if (fm) {
        status.textContent = '正在播放…';
        fm.play(playUrl, title, {
          headers: { Referer: url, 'User-Agent': UA },
          credentials: 'include'
        }).then(() => {
          status.textContent = '播放中';
        }).catch(e => {
          status.textContent = '播放失败: ' + e.message;
        });
      } else {
        status.textContent = 'fm SDK 未就绪';
      }
    } else {
      // 如果不确定，尝试将地址作为播放页再次请求（递归？但可能导致死循环，暂时放弃）
      status.textContent = '未知播放地址格式';
      console.warn('未知播放地址:', playUrl);
    }

  } catch(e) {
    status.textContent = '解析失败: ' + e.message;
    console.error(e);
  }
}

// ============ 初始化 ============
function init(){
  renderTabs(CATS[0][1]);
  $('#searchForm').onsubmit = function(e){ e.preventDefault(); search($('#kw').value); };
  watchOuterAds();
  loadCategory(CATS[0][1], 1);
}

waitFm().then(function(){
  console.log('[华视] SDK 就绪');
  init();
}).catch(function(){
  console.warn('[华视] SDK 未就绪，使用普通模式');
  init();
});

})();
</script>
</body>
</html>
